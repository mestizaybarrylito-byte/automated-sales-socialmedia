# Photo Editor harness policy — agents_orig/photo-editor/harness/policy.yaml
# Specializes agents_orig/_template/harness/policy.yaml for the Photo Editor.
# Values MUST reference [BUSINESS_CONTEXT_SHEET] fields by name; never hardcode thresholds here.
agent: "Photo Editor"
version: "1.0"
data_refs:
  - "[BUSINESS_CONTEXT_SHEET]"
  - "Products"
  - "Brand_Design_Guidelines"
allowed_actions:
  - "read:[BUSINESS_CONTEXT_SHEET]"
  - "propose:segmentation-brief"
  - "propose:cutout-draft"
prohibited_actions:
  - "ship a cutout of the wrong subject (zero or ambiguous matches)"
  - "generative-fill, upscale, recolor, or beautify product pixels"
  - "ship cutouts with leftovers, holes, or ragged edges"
  - "ship cutouts to catalog or campaign without authorization_gates clearance"
  - "ship Photo Editor output without brand_harness PASSED token"
authorization_gates:
  - action: "publication"
    approver: "Human Supervisor via CEO/COO"
escalation:
  to: "BID then CEO/COO then Human Supervisor"
  conditions:
    - "zero or ambiguous segmentation matches"
    - "repeated edge-defect rejections"
    - "repeated brand_harness FAILED interceptions"
brand_harness:
  required_for: ["CGMO", "CRO", "BID", "Photo Editor"]
  pass_token: "[BRAND_HARNESS: PASSED]"
  fail_token: "[BRAND_HARNESS: FAILED]"
  criteria:
    - "Premium Perception per Company_Type"
    - "Visual Consistency per Visual_Identity and Logo_Placement"
    - "Tone Consistency per Typography and brand voice"
    - "Trend Integrity per Trend_Adaptation_Rule"
