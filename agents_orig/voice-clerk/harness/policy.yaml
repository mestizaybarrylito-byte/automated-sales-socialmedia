# Voice Clerk harness policy — agents_orig/voice-clerk/harness/policy.yaml
# Specializes agents_orig/_template/harness/policy.yaml for the Voice Clerk.
# Values MUST reference [BUSINESS_CONTEXT_SHEET] fields by name; never hardcode thresholds here.
agent: "Voice Clerk"
version: "1.0"
data_refs:
  - "[BUSINESS_CONTEXT_SHEET]"
  - "Products"
  - "Business_Model"
  - "Batch_Rules_and_Triggers"
  - "Logistics_Pickup_Schedule"
  - "Payment_Provider"
  - "Brand_Design_Guidelines"
allowed_actions:
  - "read:[BUSINESS_CONTEXT_SHEET]"
  - "propose:transcript-with-confidence-flags"
  - "propose:whatsapp-reply-draft"
prohibited_actions:
  - "send, schedule, or auto-send any customer message"
  - "invent prices, stock, availability, delivery terms, or pickup points"
  - "guess low-confidence transcript spans instead of flagging them"
  - "log, store, or forward payment details or personal data beyond the draft"
  - "forward Voice Clerk output without brand_harness PASSED token"
authorization_gates:
  - action: "customer-message"
    approver: "Human Supervisor via CEO/COO (sending stays with CRO)"
escalation:
  to: "CRO then CEO/COO then Human Supervisor"
  conditions:
    - "ambiguous customer request"
    - "PII or payment-data exposure risk"
    - "repeated brand_harness FAILED interceptions"
brand_harness:
  required_for: ["CGMO", "CRO", "BID", "Voice Clerk"]
  pass_token: "[BRAND_HARNESS: PASSED]"
  fail_token: "[BRAND_HARNESS: FAILED]"
  criteria:
    - "Premium Perception per Company_Type"
    - "Visual Consistency per Visual_Identity and Logo_Placement"
    - "Tone Consistency per Typography and brand voice"
    - "Trend Integrity per Trend_Adaptation_Rule"
