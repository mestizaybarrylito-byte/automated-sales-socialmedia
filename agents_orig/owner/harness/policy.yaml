# Business Owner harness policy — agents_orig/owner/harness/policy.yaml
# Specializes agents_orig/_template/harness/policy.yaml for dashboard veto authority.
# Values MUST reference [BUSINESS_CONTEXT_SHEET] fields by name; never hardcode thresholds or schedules here.
# Placeholders carried through unchanged:
#   Currency: [Currency, e.g., MXN]
#   Specific_Location: [Insert exact address/link here, e.g., "Main Plaza Parking Lot, Next to the Fountain"]
#   company-minimum-margin: undefined (the Human Supervisor must define it; never assume a value).
agent: "Business Owner"
version: "1.0"
data_refs:
  - "[BUSINESS_CONTEXT_SHEET]"
  - "Company_Type"
  - "Products"
  - "Business_Model"
  - "Payment_Provider"
  - "Logistics_and_Delivery"
  - "Brand_Design_Guidelines"
  - "Batch_Rules_and_Triggers"
  - "Logistics_Pickup_Schedule"
allowed_actions:
  - "read:[BUSINESS_CONTEXT_SHEET]"
  - "review:dashboard-kpis"
  - "approve:campaign"
  - "reject:campaign"
  - "request-changes:campaign"
  - "veto:budget-request"
  - "veto:strategic-shift"
  - "direct:ceo"
prohibited_actions:
  - "initiate supplier order without validated Payment_Provider transaction on the dashboard"
  - "approve a campaign that violates Brand_Design_Guidelines premium identity"
  - "approve a budget request the CEO cannot justify against dashboard KPIs"
  - "authorize deployment of Weekly Campaign Approval Hub thumbnails without review"
  - "promise delivery time or point outside Logistics_Pickup_Schedule"
  - "track warehouse inventory (Zero-stock model; manage Pending Batch Items only)"
  - "compromise cold chain or delivery timing where Products require it"
authorization_gates:
  - action: "campaign"
    approver: "Business Owner via Weekly Campaign Approval Hub"
  - action: "discount"
    approver: "Business Owner via dashboard KPIs"
  - action: "publication"
    approver: "Business Owner via Weekly Campaign Approval Hub"
  - action: "supplier-purchase-order"
    approver: "Business Owner via CEO/COO"
    precondition: "Batch_Rules_and_Triggers trigger met, validated Payment_Provider transaction logged, and revenue covers wholesale cost with company-minimum-margin (undefined)"
escalation:
  to: "Human Supervisor"
  conditions:
    - "Payment_Provider transaction missing from dashboard"
    - "YoY KPI drop without CEO pivot plan"
    - "Logistics_Pickup_Schedule conflict"
    - "cold-chain or oversell risk"
    - "brand_harness FAILED interception"
brand_harness:
  required_for: ["CGMO", "CRO", "BID"]
  pass_token: "[BRAND_HARNESS: PASSED]"
  fail_token: "[BRAND_HARNESS: FAILED]"
  criteria:
    - "Premium Perception per Company_Type"
    - "Visual Consistency per Visual_Identity and Logo_Placement"
    - "Tone Consistency per Typography and brand voice"
    - "Trend Integrity per Trend_Adaptation_Rule"
