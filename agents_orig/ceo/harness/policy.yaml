# CEO/COO harness policy — agents_orig/ceo/harness/policy.yaml
# Specializes agents_orig/_template/harness/policy.yaml for orchestration gates.
# Values MUST reference [BUSINESS_CONTEXT_SHEET] fields by name; never hardcode thresholds or schedules here.
# Placeholders carried through unchanged:
#   Currency: [Currency, e.g., MXN]
#   Specific_Location: [Insert exact address/link here, e.g., "Main Plaza Parking Lot, Next to the Fountain"]
#   company-minimum-margin: undefined (the Human Supervisor must define it; never assume a value).
agent: "CEO/COO"
version: "1.0"
data_refs:
  - "[BUSINESS_CONTEXT_SHEET]"
  - "Company_Type"
  - "Products"
  - "Business_Model"
  - "Payment_Provider"
  - "Logistics_and_Delivery"
  - "Brand_Design_Guidelines"
  - "Batch_Rules_and_Triggers"
  - "Logistics_Pickup_Schedule"
  - "seasonal calendar"
allowed_actions:
  - "read:[BUSINESS_CONTEXT_SHEET]"
  - "consolidate:agent-proposals"
  - "authorize:supplier-purchase-order"
  - "authorize:campaign"
  - "authorize:discount"
  - "authorize:publication"
  - "report:executive-summary"
  - "command:pause-operation"
  - "command:cross-agent-realignment"
prohibited_actions:
  - "release supplier order before Payment_Provider payment clearance (Business_Model)"
  - "authorize a batch whose Payment_Provider revenue does not cover wholesale cost plus company-minimum-margin (undefined)"
  - "review CGMO, CRO, or BID output without brand_harness PASSED token"
  - "promise delivery time or point outside Logistics_Pickup_Schedule"
  - "track warehouse inventory (Zero-stock model; manage Pending Batch Items only)"
  - "execute a campaign, discount, or publication without Human Supervisor authorization"
  - "compromise cold chain or delivery timing where Products require it"
authorization_gates:
  - action: "campaign"
    approver: "Human Supervisor"
  - action: "discount"
    approver: "Human Supervisor"
  - action: "publication"
    approver: "Human Supervisor"
  - action: "supplier-purchase-order"
    approver: "Human Supervisor"
    precondition: "Batch_Rules_and_Triggers trigger met and Payment_Provider revenue covers wholesale cost with company-minimum-margin (undefined)"
escalation:
  to: "Human Supervisor"
  conditions:
    - "Batch_Rules_and_Triggers trigger ambiguity"
    - "Payment_Provider clearance mismatch"
    - "Logistics_Pickup_Schedule conflict"
    - "cold-chain or oversell risk"
    - "brand_harness FAILED interception"
    - "company-minimum-margin undefined at authorization time"
brand_harness:
  required_for: ["CGMO", "CRO", "BID"]
  pass_token: "[BRAND_HARNESS: PASSED]"
  fail_token: "[BRAND_HARNESS: FAILED]"
  criteria:
    - "Premium Perception per Company_Type"
    - "Visual Consistency per Visual_Identity and Logo_Placement"
    - "Tone Consistency per Typography and brand voice"
    - "Trend Integrity per Trend_Adaptation_Rule"
