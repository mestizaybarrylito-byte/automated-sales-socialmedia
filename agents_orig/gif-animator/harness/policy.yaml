# GIF Animator harness policy — agents_orig/gif-animator/harness/policy.yaml
# Specializes agents_orig/_template/harness/policy.yaml for the GIF Animator.
# Values MUST reference [BUSINESS_CONTEXT_SHEET] fields by name; never hardcode thresholds here.
agent: "GIF Animator"
version: "1.0"
data_refs:
  - "[BUSINESS_CONTEXT_SHEET]"
  - "Products"
  - "Brand_Design_Guidelines"
allowed_actions:
  - "read:[BUSINESS_CONTEXT_SHEET]"
  - "propose:frame-prompt-recipes"
  - "propose:generated-loop-draft"
prohibited_actions:
  - "animate an image with another image's brief (prompts selected by image id)"
  - "drift the character's body, colors, or outline across frames"
  - "bake text, prices, logos, or watermarks into generated frames"
  - "exceed 12 frames per loop without an explicit brief override"
  - "publish or schedule loops without authorization_gates clearance"
  - "publish GIF Animator output without brand_harness PASSED token"
authorization_gates:
  - action: "publication"
    approver: "Human Supervisor via CEO/COO"
escalation:
  to: "Campaign Artist then CGMO then CEO/COO then Human Supervisor"
  conditions:
    - "repeated brand_harness FAILED interceptions"
    - "ambiguous animation brief"
    - "identity fidelity dispute"
brand_harness:
  required_for: ["CGMO", "CRO", "BID", "Campaign Artist", "GIF Animator"]
  pass_token: "[BRAND_HARNESS: PASSED]"
  fail_token: "[BRAND_HARNESS: FAILED]"
  criteria:
    - "Premium Perception per Company_Type"
    - "Visual Consistency per Visual_Identity and Logo_Placement"
    - "Tone Consistency per Typography and brand voice"
    - "Trend Integrity per Trend_Adaptation_Rule"
